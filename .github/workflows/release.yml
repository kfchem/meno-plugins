name: Release a plugin

# A plugin is released in two steps, as Meno is:
# - a tag <id>-v<version> on main: that plugin's folder checked and packed, and its release made as a DRAFT (`pack`);
# - the maintainer's Publish of that release: the catalogue made again from every PUBLISHED plugin release - a draft
#   never counts - signed, checked, and put on the release `catalogue` (`catalogue`). The catalogue's release needs no
#   second Publish: the plugin's is the gate.
# Its signing key is the repository's (CATALOGUE_SIGNING_KEY, CATALOGUE_SIGNING_PASSWORD).
#
# The catalogue is made by one run at a time (`concurrency`, never cancelling one under way). One waiting may give way
# to a later one; that is no loss, as each makes it from every published release there is - so the last made holds
# them all. Meno orders catalogues by when each was issued (UTC, to the second): each signed here is issued strictly
# later than the one published before it.
on:
  push:
    tags: ["*-v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  pack:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The tag is a plugin's version, on main
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          id="${tag%-v*}"; version="${tag##*-v}"
          test -f "plugins/$id/manifest.json"
          test "$(python3 -c "import json;print(json.load(open('plugins/$id/manifest.json'))['version'])")" = "$version"
          # (a tag on a commit main does not hold - a branch's - releases nothing)
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "id=$id" >> "$GITHUB_OUTPUT"; echo "version=$version" >> "$GITHUB_OUTPUT"
      # (the folders' layout and marks; each plugin's own tests run in CI on every pull request before it reaches main)
      - run: python3 -m unittest tests/test_layout.py tests/test_marks.py
      - name: Its archive, in a draft release - published by the maintainer, or not at all
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I tools/pack.py "plugins/${{ steps.tag.outputs.id }}" dist > dist.txt
          gh release create "$GITHUB_REF_NAME" "$(head -1 dist.txt)" --draft --title "$GITHUB_REF_NAME" --notes "${{ steps.tag.outputs.id }} ${{ steps.tag.outputs.version }}" --latest=false

  catalogue:
    # (a plugin's release published - its tag <id>-v<version> - never the catalogue's own release, nor a prerelease)
    if: github.event_name == 'release' && contains(github.event.release.tag_name, '-v') && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    concurrency:
      group: catalogue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: The catalogue, made again from every published release and signed
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.CATALOGUE_SIGNING_KEY }}
          PASSWORD: ${{ secrets.CATALOGUE_SIGNING_PASSWORD }}
        run: |
          set -e
          mkdir -p latest
          # (each plugin's newest PUBLISHED release: a draft never counts)
          gh release list --limit 500 --json tagName,isDraft,isPrerelease,createdAt > releases.json
          for id in $(ls plugins); do
            tag=$(python3 -I tools/published.py releases.json "$id")
            [ -n "$tag" ] && gh release download "$tag" --pattern "$id-*.tar.gz" --dir latest
          done
          # (issued strictly later than the catalogue published: Meno refuses an earlier one, and takes an equal one only
          #  where it is the same list - the clock waited on, a second at a time, for a minute at most)
          last=$(gh release download catalogue --pattern catalogue.json --output - 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('issued', ''))" || echo "")
          issued=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for i in $(seq 1 60); do
            { [ -z "$last" ] || [ "$issued" \> "$last" ]; } && break
            sleep 1; issued=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          done
          [ -z "$last" ] || [ "$issued" \> "$last" ] || { echo "the clock is not past the catalogue published ($last)"; exit 1; }
          # (two lists, one issued: catalogue.json, what the oldest released Meno still in use reads whole; catalogue-2.json,
          #  every entry, for Meno 0.1.23 and later - tools/readers.json)
          python3 -I tools/build_catalogue.py latest "https://github.com/${GITHUB_REPOSITORY}/releases/download" "$issued" --full catalogue-2.json > catalogue.json
          sudo apt-get install -y minisign
          # (a key made on Windows, its secret pasted with CRLF line ends: the carriage returns taken out of the key and
          #  the password alike, which minisign would otherwise read as part of them)
          printf '%s' "$KEY" | tr -d '\r' > key.txt
          for list in catalogue.json catalogue-2.json; do
            printf '%s\n' "$(printf '%s' "$PASSWORD" | tr -d '\r')" | minisign -S -s key.txt -m "$list" -x "$list.minisig"
          done
          rm key.txt
          # (the signature checked against the public key Meno carries, tools/catalogue.pub, before anything is uploaded:
          #  a wrong secret fails here, never publishing a catalogue Meno would refuse)
          for list in catalogue.json catalogue-2.json; do minisign -V -p tools/catalogue.pub -m "$list" -x "$list.minisig"; done
          gh release view catalogue >/dev/null 2>&1 || gh release create catalogue --title catalogue --notes "The catalogue Meno reads."
          gh release upload catalogue catalogue.json catalogue.json.minisig catalogue-2.json catalogue-2.json.minisig --clobber
          # (the release Meno's fixed address takes as latest: releases/latest/download/catalogue.json)
          gh release edit catalogue --latest
